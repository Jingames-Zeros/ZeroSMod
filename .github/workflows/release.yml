name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      jar: ${{ steps.meta.outputs.jar }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble
        run: |
          chmod +x ./gradlew
          ./gradlew :assemble --refresh-dependencies

      - name: Test
        run: ./gradlew :check

      - name: Generate API docs
        run: ./gradlew :javadoc

      - name: Determine version and jar
        id: meta
        run: |
          version=$(sed -n 's/^modVersion *= *//p' gradle.properties | tr -d '\r')
          # The release jar is the one without a classifier (-dev, -sources, -preshadow)
          jar=$(find build/libs -maxdepth 1 -name "*-${version}.jar" -printf '%f\n')
          if [ -z "$version" ] || [ "$(echo "$jar" | wc -l)" -ne 1 ] || [ -z "$jar" ]; then
            echo "::error::Could not determine a single release jar (version='$version', jars='$jar')"
            ls -la build/libs
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.jar }}
          path: build/libs/${{ steps.meta.outputs.jar }}
          if-no-files-found: error

      - name: Upload API docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/javadoc

  release:
    name: Release
    needs: build
    # Only main releases; PRs just build and test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump modVersion in gradle.properties to publish a new one."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download jar
        if: steps.check.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.jar }}

      - name: Sign jar (build provenance)
        if: steps.check.outputs.new == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.jar }}

      - name: Create release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          JAR: ${{ needs.build.outputs.jar }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$JAR.sigstore.json"
          gh release create "$TAG" "$JAR" "$JAR.sigstore.json" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  docs:
    name: Publish API docs
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
