plugins {
    id 'com.jingames.zeros.mod'
}

zeros {
    apiDocs {
        title = 'Zero S Script API'
        sectionName = 'Zero S API'
        // The CustomNPC+ API is documented inside our docs, so its types link within them
        bundleCnpcApi = true
        overview = file('src/docs/javadoc/overview.html')
        // How scripts reach these types, for the "JS" call examples
        scriptReceivers = [
                'org.darkoro.zerosmod.api.ZSAPI'                                  : 'ZSAPI',
                'org.darkoro.zerosmod.api.WeaponAPI'                              : 'WeaponAPI',
                'org.darkoro.zerosmod.api.ScriptLivingKiMethods'                  : 'npc',
                'org.darkoro.zerosmod.api.ScriptPlayerInstantTransmissionMethods' : 'player',
                'org.darkoro.zerosmod.api.ScriptKiAttackEntityMethods'            : 'kiAttack',
                'org.darkoro.zerosmod.api.ScriptZSWeapon'                         : 'weapon',
                'org.darkoro.zerosmod.api.ScriptPlayerCombatState'                : 'state',
        ]
    }
    deps {
        // JRMCore/DBC, CustomNPC+ and the DBC Addon are on by default
        codeChicken = false
    }
}

tasks.named('jar', Jar) {
    from sourceSets.main.output
}

tasks.named('shadowJar') {
    from sourceSets.main.output
}

tasks.register('testRaceStatConfig', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.darkoro.zerosmod.config.RaceStatConfigTest'
}

tasks.named('check') {
    dependsOn tasks.named('testRaceStatConfig')
}
